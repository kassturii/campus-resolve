<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Grievance & Resource Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
          <label>Student Name / Roll No.</label>
          <input type="text" id="student_name" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Category</label>
            <select id="category" required>
              <option value="Computer Lab">Lab / Hardware</option>
              <option value="Hostel Maintenance">Hostel Maintenance</option>
              <option value="Classroom & Projector">Classroom & AV</option>
              <option value="Sanitation & Water">Sanitation & Water</option>
              <option value="Lost & Found">Lost & Found</option>
            </select>
          </div>

          <div class="form-group">
            <label>Priority</label>
            <select id="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
              <option value="Critical">Critical</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Campus Location</label>
          <input type="text" id="location" placeholder="e.g. Block C, Lab 204 or Hostel 3 Room 12" required>
        </div>

        <div class="form-group">
          <label>Issue Description</label>
          <textarea id="description" rows="3" placeholder="Describe the fault or required repair..." required></textarea>
        </div>

        <button type="submit" class="btn primary-btn">Submit Ticket</button>
      </form>
    </section>

    <!-- Admin / Student Ticket Feed -->
    <section class="card feed-card">
      <div class="feed-header">
        <h2>Live Campus Tickets</h2>
        <button class="btn secondary-btn" id="refreshBtn">Refresh</button>
      </div>

      <div class="ticket-list" id="ticketList">
        <p class="empty-state">Loading tickets...</p>
      </div>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
